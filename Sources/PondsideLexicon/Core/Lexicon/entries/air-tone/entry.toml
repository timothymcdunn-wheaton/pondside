schema   = 1
id       = "air-tone"
version  = "1.0.0"
gloss    = "Air sound: diamond noteheads and a label; cues the patch's air noise"
tags     = ["extended", "winds", "air", "electronics"]
kind     = "texture"
lilypond = ">=2.24"
license  = "CC0-1.0"

[entry]
command   = "\\lexicon \"air-tone\" #'((amount . 0.7)) { d''2 e'' }"
attaches  = "span"
music-arg = true

[params.amount]
type    = "float"
default = 0.5
min     = 0.0
max     = 1.0
doc     = "Air to tone: 0 is nearly all tone, 1 all air"

[params.label]
type    = "markup"
default = "air"
doc     = "The text over the first note"

[sound]
synthdef = "airNoise"
cue      = "airTone"
params   = { amp = "0.05 + 0.4 * amount", dur = "spanDur", rate = "tempo / 60" }
emit     = "onset"

[files]
impl   = "impl.ily"
readme = "README.md"
