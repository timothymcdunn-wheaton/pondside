schema   = 1
id       = "scribble"
version  = "1.0.0"
gloss    = "Short random strokes in a band: a rough, scratchy texture"
tags     = ["graphic", "texture", "strokes", "noise"]
kind     = "graphic"
lilypond = ">=2.24"
license  = "CC0-1.0"

[entry]
command   = "\\startGraphic \"scribble\" #'((height . 1)) s1 \\stopGraphic"
attaches  = "span"
music-arg = false

[params.density]
type    = "float"
default = 0.5
min     = 0.0
max     = 3.0
doc     = "Strokes per square staff space"

[params.height]
type    = "envelope"
default = ["constant", 1.5]
doc     = "Half-height of the band over the span"

[params.centre]
type    = "envelope"
default = 0
doc     = "Staff spaces from the middle line"

[params.length]
type    = "float"
default = 0.6
min     = 0.1
max     = 3.0
doc     = "Stroke length, staff spaces"

[params.spread]
type    = "float"
default = 60
min     = 0
max     = 180
doc     = "How far strokes turn from horizontal, degrees"

[params.thickness]
type    = "float"
default = 0.08
min     = 0.02
max     = 0.4
doc     = "Stroke thickness, staff spaces"

[params.seed]
type    = "int"
default = 0
doc     = "Same seed, same drawing"

[files]
impl   = "impl.ily"
readme = "README.md"
