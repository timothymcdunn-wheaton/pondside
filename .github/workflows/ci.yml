name: CI

on:
  push:
  pull_request:

# A new push supersedes the previous run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The portability seam: every module below PondsideUI builds and passes its
  # full test suite on Linux. A platform leak below the seam fails here.
  linux:
    runs-on: ubuntu-24.04
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Seam check
        run: ./scripts/check-seam.sh
      - name: Install LilyPond (integration tests)
        run: apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq lilypond > /dev/null && lilypond --version | head -1
      - name: Fetch LilyPond corpus (regression tests + snippets, v2.24.3)
        run: |
          apt-get install -y -qq curl > /dev/null
          mkdir -p /tmp/corpus && cd /tmp/corpus
          for p in input/regression Documentation/snippets; do
            curl -sSfL "https://gitlab.com/lilypond/lilypond/-/archive/v2.24.3/lilypond-v2.24.3.tar.gz?path=$p" | tar xz
          done
          cp -r /usr/share/lilypond/*/ly /tmp/corpus/init-ly
          find /tmp/corpus -name '*.ly' | wc -l
      - name: Build
        run: swift build --build-tests
      - name: Test
        env:
          PONDSIDE_CORPUS: /tmp/corpus
        shell: bash
        run: |
          set -o pipefail
          status=0
          swift test --skip-build 2>&1 | tee test.log > /dev/null || status=$?
          echo "──────── summary ────────"
          grep -E "error:|Fatal error|fatal error|Crash|crashed|corpus:|recovered:|Pondside benchmark|Executed .* tests" test.log | head -150 || true
          echo "last test started:"; grep -E "Test Case .* started" test.log | tail -1 || true
          exit $status

  # The same suite against LilyPond 2.26 (Homebrew's version), where the
  # daemon, settings and SVG output differ from 2.24 (DESIGN.md, M4).
  linux-lilypond-2-26:
    runs-on: ubuntu-24.04
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install LilyPond 2.26.0 (official build)
        run: |
          apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl > /dev/null
          curl -sSfL "https://gitlab.com/lilypond/lilypond/-/releases/v2.26.0/downloads/lilypond-2.26.0-linux-x86_64.tar.gz" | tar xz -C /opt
          ln -s /opt/lilypond-2.26.0/bin/lilypond /usr/local/bin/lilypond
          lilypond --version | head -1
          ls /opt/lilypond-2.26.0/share/lilypond/2.26.0/fonts/ || true
      - name: Build
        run: swift build --build-tests
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          status=0
          swift test --skip-build 2>&1 | tee test.log > /dev/null || status=$?
          echo "──────── summary ────────"
          grep -E "error:|Fatal error|fatal error|Crash|crashed|skipped|Pondside benchmark|Executed .* tests" test.log | head -150 || true
          exit $status

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift 6.4.1
        run: |
          brew install swiftly
          swiftly init --skip-install --assume-yes
          swiftly install 6.4.1
          swiftly use 6.4.1
          echo "$HOME/.swiftly/bin" >> "$GITHUB_PATH"
      - name: Toolchain
        run: swift --version
      - name: Build (all targets, including the app)
        run: swift build --build-tests
      - name: Test
        run: swift test --skip-build
      - name: Bundle app
        run: ./scripts/make-app.sh debug
